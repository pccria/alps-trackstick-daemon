name: CI

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [ gcc, clang ]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ${{ matrix.cc }}

      - name: Build daemon and test suite
        run: |
          make clean
          CC=${{ matrix.cc }} make

      - name: Run unit test suite
        run: |
          CC=${{ matrix.cc }} make test

      - name: Run sanitizer test suite (ASan + UBSan)
        run: |
          CC=${{ matrix.cc }} make sanitize

      - name: Verify CLI argument parser
        run: |
          ./bin/alps-stick --help
          ./bin/alps-stick --version
